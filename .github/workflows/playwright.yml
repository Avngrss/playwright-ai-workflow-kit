name: Playwright Starter Quality Gate
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  quality-gate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run qa:gate
      - name: Verify Playwright test discovery
        run: npx playwright test --list --pass-with-no-tests
