name: Playwright Starter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  baseline:
    name: Baseline Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_tests: ${{ steps.detect-tests.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run qa:gate
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Playwright test discovery
        run: npm run test:list
      - name: Detect test files
        id: detect-tests
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(tests/**/*.spec.ts tests/**/*.test.ts)
          if (( ${#files[@]} > 0 )); then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Detected ${#files[@]} test file(s)"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test files detected; matrix jobs will be skipped."
          fi

  matrix-tests:
    name: ${{ matrix.name }}
    needs: baseline
    if: needs.baseline.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Repository variables (Settings → Secrets and variables → Actions → Variables).
    # Empty when unset — baseline gate does not require them; matrix runs only when tests exist.
    # Keep starter mappings minimal. Real projects add only Feature Targets
    # registered in the project map and used by their tests.
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL || '' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            browser: none
            command: npm run test:api
          - name: UI Chromium
            browser: chromium
            command: npm run test:ui
          - name: E2E
            browser: chromium
            command: npm run test:e2e
          - name: Smoke
            browser: chromium
            command: npm run test:smoke
          - name: Regression
            browser: chromium
            command: npm run test:regression
          - name: Visual
            browser: chromium
            command: npm run test:visual
          - name: Cross-Browser Chromium
            browser: chromium
            command: npx playwright test --project=ui-chromium --grep @cross-browser --pass-with-no-tests
          - name: Cross-Browser Firefox
            browser: firefox
            command: npx playwright test --project=ui-firefox --grep @cross-browser --pass-with-no-tests
          - name: Cross-Browser WebKit
            browser: webkit
            command: npx playwright test --project=ui-webkit --grep @cross-browser --pass-with-no-tests
          - name: Responsive Mobile Chromium
            browser: chromium
            command: npx playwright test --project=ui-mobile-chromium --grep @responsive --pass-with-no-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser runtime
        if: matrix.browser != 'none'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run matrix command
        run: ${{ matrix.command }}
      - name: Generate Allure report
        if: always() && hashFiles('reports/allure/results/**') != ''
        run: npm run report:allure:generate
      - name: Upload Playwright HTML report
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 14
      - name: Upload Playwright test results
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 14
      - name: Upload Allure results
        if: always() && hashFiles('reports/allure/results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.name }}
          path: reports/allure/results/
          retention-days: 14
      - name: Upload Allure report
        if: always() && hashFiles('reports/allure/html/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.name }}
          path: reports/allure/html/
          retention-days: 14
