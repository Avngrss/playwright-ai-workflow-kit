name: Playwright Starter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  baseline:
    name: Baseline Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_tests: ${{ steps.detect-tests.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret scan reads the commits of the push or the pull request — they must be in the clone.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run qa:gate
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Playwright test discovery
        run: npm run test:list
      - name: Detect test files
        id: detect-tests
        shell: bash
        run: |
          shopt -s globstar nullglob
          # Feature tests only — the template's sign-in smoke is there from the start.
          files=(tests/api/**/*.spec.ts tests/ui/**/*.spec.ts tests/e2e/**/*.spec.ts)
          if (( ${#files[@]} > 0 )); then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Detected ${#files[@]} feature test file(s)"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No feature tests yet; matrix jobs will be skipped."
          fi

  matrix-tests:
    name: ${{ matrix.name }}
    needs: baseline
    if: needs.baseline.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub passes only what is named here (Settings → Secrets and variables → Actions): add every
    # .env name of specs/project-map.md — vars.<NAME> for addresses, secrets.<NAME> for logins,
    # passwords and keys (e.g. SHOP_LOGIN: ${{ secrets.SHOP_LOGIN }}). Empty when unset.
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL || '' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Functional Smoke
            browser: chromium
            command: npm run test:smoke
          - name: Functional Regression
            browser: chromium
            command: npm run test:regression
          - name: Visual
            browser: chromium
            command: npm run test:visual
          - name: Cross-Browser Chromium
            browser: chromium
            command: npx playwright test --project="ui*" --grep @cross-browser --grep-invert "@wip|@flaky" --pass-with-no-tests
          - name: Cross-Browser Firefox
            browser: firefox
            command: npx playwright test --project="firefox*" --grep @cross-browser --grep-invert "@wip|@flaky" --pass-with-no-tests
          - name: Cross-Browser WebKit
            browser: webkit
            command: npx playwright test --project="webkit*" --grep @cross-browser --grep-invert "@wip|@flaky" --pass-with-no-tests
          - name: Responsive Mobile Chromium
            browser: chromium
            command: npx playwright test --project="mobile*" --grep @responsive --grep-invert "@wip|@flaky" --pass-with-no-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser runtime
        if: matrix.browser != 'none'
        # Chromium always: every project waits for the app's sign-in smoke, which runs in Chromium.
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Run matrix command
        run: ${{ matrix.command }}
      - name: Generate Allure report
        if: always() && hashFiles('reports/allure/results/**') != ''
        run: npm run allure:report
      - name: Upload Playwright HTML report
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 14
      - name: Upload Playwright test results
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 14
      - name: Upload Allure results
        if: always() && hashFiles('reports/allure/results/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.name }}
          path: reports/allure/results/
          retention-days: 14
      - name: Upload Allure report
        if: always() && hashFiles('reports/allure/html/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.name }}
          path: reports/allure/html/
          retention-days: 14
